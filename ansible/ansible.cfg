[defaults]
# Inventory luon duoc web UI sinh ra va truyen vao bang -i, khong dat mac dinh.
roles_path           = roles
host_key_checking    = False
retry_files_enabled  = False
stdout_callback      = default
display_skipped_hosts = False
display_ok_hosts     = True
bin_ansible_callbacks = True
interpreter_python   = auto_silent
gathering            = smart
timeout              = 30
forks                = 20
deprecation_warnings = False

[ssh_connection]
pipelining   = True
ssh_args     = -o ControlMaster=auto -o ControlPersist=120s -o PreferredAuthentications=publickey,password -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
scp_if_ssh   = smart

[persistent_connection]
connect_timeout = 30
command_timeout = 60
